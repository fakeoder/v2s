name: build

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: python -m pip install -e ".[dev,gui]"

      - name: Run tests
        run: python -m pytest

      - name: Build with PyInstaller
        run: python -m PyInstaller --clean --noconfirm v2s.spec

      - name: Build GUI with PyInstaller
        run: python -m PyInstaller --clean --noconfirm v2s-gui.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2s-${{ matrix.os }}
          path: |
            dist/v2s
            dist/v2s.exe
            dist/v2s-gui
            dist/v2s-gui.exe

      - name: Publish release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/v2s
            dist/v2s.exe
            dist/v2s-gui
            dist/v2s-gui.exe
